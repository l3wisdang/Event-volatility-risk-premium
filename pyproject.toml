[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrplab"
version = "0.1.0"
description = "Research platform for the event volatility risk premium, with an Interactive Brokers data layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "pyarrow>=12"]

[project.optional-dependencies]
ib = ["ibapi>=9.81"]
free = ["yfinance>=0.2"]
dash = ["streamlit>=1.30", "matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
